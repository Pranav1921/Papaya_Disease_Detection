name: papaya_flutter_app
description: "ಕರ್ನಾಟಕ ಪಪ್ಪಾಯಿ ಕೃಷಿ ವೈದ್ಯ - Papaya Disease Detection & Agriculture Assistance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  animated_text_kit: ^4.2.2
  image_picker: ^1.0.7
  audioplayers: ^6.0.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  pdf: ^3.10.7
  printing: ^5.11.1
  flutter_tts: ^3.8.5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  http: ^1.2.0
  camera: ^0.10.5
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
